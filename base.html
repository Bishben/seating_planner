<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="bootstrap.min.css" rel="stylesheet" />
    <style>
      /* Default to dark mode */
      body {
        background-color: #121212;
        color: white;
      }

      .light-mode {
        background-color: white !important;
        color: black !important;
      }

      .toggle-btn {
        border: none;
        background: transparent;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
      }

      .light-mode .toggle-btn {
        color: black;
      }
    </style>
  </head>
  <body class="dark-mode">
    <nav
      class="navbar navbar bg-dark border-bottom border-body navbar-expand-lg bg-body-tertiary"
      data-bs-theme="dark"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Seating Planner</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">History</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Exams
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Branches</a></li>
                <li><a class="dropdown-item" href="#">Rooms</a></li>
              </ul>
            </li>
          </ul>
          <button id="themeToggle" class="toggle-btn">🌙</button>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    
        <!-- Card 2 -->
        <div class="col-md-4 mb-3">
          <div
            class="card text-bg-dark border-secondary mb-3 h-100 position-relative"
            style="max-width: 540px"
          >
            <div class="card-body">
              <h5 class="card-title">GMAT102</h5>
              <p class="card-text">Details</p>
              <button
                type="button"
                class="btn btn-primary position-absolute top-0 end-0 m-2"
                data-bs-toggle="modal"
                data-bs-target="#editModal2"
              >
                Edit
              </button>
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item text-bg-dark border-secondary">
                Date: 15/10/2025
              </li>
              <li class="list-group-item text-bg-dark border-secondary">
                Time: 2:00 P.M.
              </li>
              <li class="list-group-item text-bg-dark border-secondary">
                Branches: CB, CD
              </li>
            </ul>
            <div class="card-footer text-light border-secondary">
              1 week ago
            </div>
          </div>
        </div>

        <!-- Edit Modal for Card 2 -->
        <div
          class="modal fade"
          id="editModal2"
          data-bs-backdrop="static"
          data-bs-keyboard="false"
          tabindex="-1"
          aria-labelledby="editModalLabel2"
          aria-hidden="true"
        >
          <div
            class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
          >
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="editModalLabel2">
                  Edit GMAT102
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <!-- Add your form fields here -->
                <label for="courseName">Course Name:</label>
                <input type="text" class="form-control" id="courseName2" value="GMAT102"/>

                <label for="date" class="mt-2">Date:</label>
                <input type="date" class="form-control" id="date2" />

                <label for="time" class="mt-2">Time:</label>
                <input type="time" class="form-control" id="time2" />

                <label for="branches" class="mt-2">Branches:</label>
                <input
                  type="text"
                  class="form-control"
                  id="branches2"
                  value="CY, CC"
                />
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button type="button" class="btn btn-primary">
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4 mb-3">
          <div
            class="card text-bg-dark border-secondary mb-3 h-100 position-relative"
            style="max-width: 540px"
          >
            <div class="card-body">
              <h5 class="card-title">GMAT103</h5>
              <p class="card-text">Details</p>
              <a
                href="#"
                class="btn btn-primary position-absolute top-0 end-0 m-2"
                >Edit</a
              >
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item text-bg-dark border-secondary">
                Date: 18/10/2025
              </li>
              <li class="list-group-item text-bg-dark border-secondary">
                Time: 4:30 P.M.
              </li>
              <li class="list-group-item text-bg-dark border-secondary">
                Branches: CX, CZ
              </li>
            </ul>
            <div class="card-footer text-light border-secondary">
              3 days ago
            </div>
          </div>
        </div>

        <!-- Add more cards here as needed -->
      </div>
    </div>

    <script>
      if (localStorage.getItem("theme") === "light") {
        document.body.classList.remove("dark-mode");
        document.body.classList.add("light-mode");
        document.getElementById("themeToggle").innerText = "☀️";
      }

      document
        .getElementById("themeToggle")
        .addEventListener("click", function () {
          if (document.body.classList.contains("dark-mode")) {
            document.body.classList.remove("dark-mode");
            document.body.classList.add("light-mode");
            localStorage.setItem("theme", "light");
            this.innerText = "☀️";
          } else {
            document.body.classList.remove("light-mode");
            document.body.classList.add("dark-mode");
            localStorage.setItem("theme", "dark");
            this.innerText = "🌙";
          }
        });
    </script>
    <script src="bootstrap.bundle.min.js"></script>
  </body>
</html>
