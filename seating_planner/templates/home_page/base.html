<!DOCTYPE html>
{% load static %}
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %} {% endblock %}</title>
        <link  rel="stylesheet" href="{% static "bootstrap.min.css" %}"/>
        <link rel="stylesheet" href="{% static "/home_page/css/base.css" %}" />
        {% block style %} {% endblock %}
    </head>

    <body class="dark-mode">
        <nav class="navbar navbar bg-dark border-bottom border-body navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand">Seating Planner</a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'home_page:events' %}">Events</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">History</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a
                                id="dropdownMenu"
                                class="nav-link dropdown-toggle"
                                href="{% url 'home_page:subjects' %}"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                Subjects
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item dropdown-option" href="{% url 'home_page:subjects' %}">Subjects</a></li>
                                <li><a class="dropdown-item dropdown-option" href="{% url 'home_page:branches' %}">Branches</a></li>
                                <li><a class="dropdown-item dropdown-option" href="{% url 'home_page:rooms' %}">Rooms</a></li>
                            </ul>
                        </li>
                    </ul>
                    <button id="themeToggle" class="toggle-btn">🌙</button>
                    <form class="d-flex" role="search">
                    <input
                        class="form-control me-2"
                        type="search"
                        placeholder="Search"
                        aria-label="Search"
                    />
                    <button class="btn btn-outline-success" type="submit">
                        Search
                    </button>
                    </form>
                </div>
            </div>
        </nav>
        {% block content %} {% endblock %}
    </body>

    <script src="{% static '/home_page/js/base.js' %}"></script>
    <script src="{% static "bootstrap.bundle.min.js" %}"></script>
    {% block script %} {% endblock %}
</html>
